name: Weekly field card refresh

# Monday pass: link health, landscape discovery, optional LLM picker propose,
# version stamp, PR with candidates for review.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check documentation links
        id: links
        continue-on-error: true
        run: node scripts/check-links.mjs

      - name: Discover frameworks and tools
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discover.mjs

      - name: Propose / apply picker updates
        id: propose
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/apply-discovery.mjs

      - name: Bump version stamp
        run: node scripts/bump-version.mjs

      - name: Summarize discovery
        id: summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('data/discovery-report.json','utf8'));
          const p = fs.existsSync('data/proposed-updates.json')
            ? JSON.parse(fs.readFileSync('data/proposed-updates.json','utf8'))
            : {};
          const stats = [
            `candidates=${d.summary.candidateCount}`,
            `notOnCard=${d.summary.notOnCard}`,
            `novel=${d.summary.novelSearchHits}`,
            `fresh=${d.summary.freshReleases}`,
            `mode=${p.mode || 'n/a'}`,
          ].join(' ');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `stats=${stats}\n`);
          const top = (d.candidates || []).slice(0, 8)
            .map(c => `- ${c.name} (${c.priority}) — ${c.kind}`)
            .join('\n') || '- none';
          fs.writeFileSync('/tmp/discovery-top.md', top);
          NODE

      - name: Open refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="chore/weekly-refresh-$(date -u +%Y-W%V)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add index.html data/link-report.json data/discovery-report.json data/discovery-report.md data/proposed-updates.json data/watchlist.json || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: weekly field card discovery + refresh"
          git push -u origin "$BRANCH" --force

          BODY_FILE=$(mktemp)
          {
            echo "## Weekly field card refresh"
            echo
            echo "Automated Monday pass:"
            echo "- Landscape discovery (GitHub search + watchlist releases)"
            echo "- Link check on Use / framework docs"
            echo "- Version stamp bump"
            echo "- Stats: \`${{ steps.summary.outputs.stats }}\`"
            echo
            if [ "${{ steps.links.outcome }}" = "success" ]; then
              echo "**Link check:** all OK"
            else
              echo "**Link check:** failures — see \`data/link-report.json\`"
            fi
            echo
            echo "### Identified candidates"
            cat /tmp/discovery-top.md
            echo
            echo "Full report: \`data/discovery-report.md\` · machine JSON: \`data/discovery-report.json\`"
            echo
            if [ -f data/proposed-updates.json ]; then
              echo "### Picker proposal"
              echo
              echo '```'
              node -e "const p=require('./data/proposed-updates.json'); console.log('mode:', p.mode); console.log((p.changelog||[]).join('\n')); if(p.deferred?.length){ console.log('deferred:'); for (const d of p.deferred.slice(0,8)) console.log('-', d.name+':', d.why);} "
              echo '```'
            fi
            echo
            echo "### Before merge"
            echo "- [ ] Accept or reject auto picker edits (if any)"
            echo "- [ ] Promote high-priority watchlist items intentionally"
            echo "- [ ] Add net-new tools to \`data/watchlist.json\` when you confirm them"
            echo "- [ ] Decision table stays pattern-based (new *job* only → new layer)"
          } > "$BODY_FILE"

          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file "$BODY_FILE"
            echo "Updated PR #$EXISTING"
          else
            gh pr create --title "chore: weekly field card discovery + refresh" --body-file "$BODY_FILE"
          fi

      - name: Open issue on broken links
        if: steps.links.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Broken doc links on field card ($(date -u +%Y-%m-%d))"
          OPEN=$(gh issue list --label field-card-links --state open --json title --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "Open link issue already exists; skipping."
            exit 0
          fi
          BODY=$(mktemp)
          {
            echo "Weekly link check failed. See \`data/link-report.json\`."
            echo
            echo '```'
            node -e "const r=require('./data/link-report.json'); for (const x of r.results.filter(x=>!x.ok)) console.log(x.status, x.url, x.error||'')"
            echo '```'
          } > "$BODY"
          gh issue create --title "$TITLE" --label "field-card-links" --body-file "$BODY" || \
            gh issue create --title "$TITLE" --body-file "$BODY"
